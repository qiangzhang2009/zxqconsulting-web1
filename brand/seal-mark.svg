<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
  <!-- Outer circle  seal red -->
  <circle cx="40" cy="40" r="38" stroke="#c41e3a" stroke-width="2.5" fill="none"/>
  <!-- Inner circle -->
  <circle cx="40" cy="40" r="33" stroke="#c41e3a" stroke-width="0.75" fill="none" opacity="0.5"/>
  <!-- Seal red fill -->
  <circle cx="40" cy="40" r="32" fill="#c41e3a" opacity="0.08"/>
  <!-- Stylized  character  abstract geometric representation -->
  <!-- Horizontal stroke top -->
  <rect x="24" y="28" width="20" height="2" fill="#c41e3a"/>
  <!-- Vertical stroke -->
  <rect x="32" y="22" width="2.5" height="36" fill="#c41e3a"/>
  <!-- Left slash -->
  <path d="M28 30 L36 46" stroke="#c41e3a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right slash -->
  <path d="M40 36 L40 54" stroke="#c41e3a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Top horizontal -->
  <rect x="26" y="24" width="18" height="2" fill="#c41e3a"/>
</svg>

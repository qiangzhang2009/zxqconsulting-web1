name = "qiangzhang2009-zxqconsulting-web1"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist"

# D1 Database for comments
[[d1_databases]]
binding = "zxqconsulting_comments"
database_name = "zxqconsulting-comments"
database_id = "84613a5c-a4f4-43a3-bd68-55d5ed95d48a"

# KV Namespace for admin sessions
[[kv_namespaces]]
binding = "ADMIN_KV"
id = "63713f347e6e4cb6be5439580aa937ba"

# Cloudflare Pages Functions
[observability]
enabled = true

# Note: For daily seeding, configure a Cron Trigger in Cloudflare Dashboard:
# Workers & Pages > qiangzhang2009-zxqconsulting-web1 > Triggers > Cron Triggers
# Schedule: 0 8 * * * (daily at 8 AM UTC)

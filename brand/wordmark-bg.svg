<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background -->
  <rect width="200" height="200" fill="#0f1114"/>
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1a1a1f" stroke-width="0.5"/>
  </pattern>
  <rect width="200" height="200" fill="url(#grid)" opacity="0.6"/>
  <!-- Horizontal strokes of  character -->
  <rect x="30" y="55" width="70" height="6" rx="2" fill="#3d8a7a" opacity="0.7"/>
  <rect x="30" y="75" width="50" height="5" rx="2" fill="#3d8a7a" opacity="0.6"/>
  <!-- Vertical strokes -->
  <rect x="60" y="40" width="6" height="110" rx="3" fill="#3d8a7a" opacity="0.8"/>
  <!-- Diagonal strokes -->
  <path d="M50 75 L80 120" stroke="#3d8a7a" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <path d="M75 90 L90 115" stroke="#3d8a7a" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  <!-- Seal mark accent  small red dot -->
  <circle cx="150" cy="150" r="20" fill="none" stroke="#c41e3a" stroke-width="1.5" opacity="0.4"/>
  <circle cx="150" cy="150" r="14" fill="none" stroke="#c41e3a" stroke-width="0.5" opacity="0.3"/>
  <circle cx="150" cy="150" r="3" fill="#c41e3a" opacity="0.5"/>
  <!-- Corner accent lines -->
  <line x1="10" y1="10" x2="30" y2="10" stroke="#c9a227" stroke-width="1" opacity="0.3"/>
  <line x1="10" y1="10" x2="10" y2="30" stroke="#c9a227" stroke-width="1" opacity="0.3"/>
  <line x1="190" y1="190" x2="170" y2="190" stroke="#c9a227" stroke-width="1" opacity="0.3"/>
  <line x1="190" y1="190" x2="190" y2="170" stroke="#c9a227" stroke-width="1" opacity="0.3"/>
</svg>

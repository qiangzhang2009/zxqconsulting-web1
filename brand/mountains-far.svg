<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320" fill="none" preserveAspectRatio="xMidYMax slice">
  <!-- Far mountain layer  most transparent -->
  <path d="M0 280 Q120 180 240 240 Q360 200 480 260 Q600 180 720 220 Q840 160 960 230 Q1080 190 1200 250 Q1320 200 1440 260 L1440 320 L0 320 Z" fill="#1a1a1f" opacity="0.6"/>
  <!-- Mid mountain layer -->
  <path d="M0 300 Q80 220 200 260 Q320 200 440 250 Q560 190 680 240 Q800 180 920 230 Q1040 200 1160 250 Q1280 210 1440 270 L1440 320 L0 320 Z" fill="#12121a" opacity="0.8"/>
  <!-- Near mountain layer  darkest -->
  <path d="M0 310 Q60 280 160 295 Q280 270 400 285 Q520 260 640 280 Q760 265 880 278 Q1000 260 1120 275 Q1240 258 1440 290 L1440 320 L0 320 Z" fill="#0a0b0e"/>
  <!-- Atmospheric haze gradient overlay -->
  <defs>
    <linearGradient id="mountainHaze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1114" stop-opacity="0"/>
      <stop offset="60%" stop-color="#0f1114" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f1114" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="320" fill="url(#mountainHaze)"/>
  <!-- Subtle gold accent line -->
  <line x1="0" y1="308" x2="1440" y2="308" stroke="#c9a227" stroke-width="0.5" opacity="0.2"/>
</svg>
